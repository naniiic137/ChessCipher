<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Cipher v4.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.11.0/sha256.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #272522;
  color: #e0ddd5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.app {
  display: flex;
  gap: 24px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px;
  align-items: flex-start;
}

/* ─── Sidebar ─── */
.sidebar {
  width: 300px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.logo {
  font-size: 22px;
  font-weight: 700;
  color: #e0ddd5;
  letter-spacing: -0.5px;
  padding: 4px 0 8px;
}

.logo span { color: #81b64c; }

.panel {
  background: #302e2b;
  border-radius: 10px;
  padding: 16px;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}

.tab {
  flex: 1;
  padding: 8px 4px;
  border: none;
  border-radius: 6px;
  background: #3a3733;
  color: #9b9892;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.tab:hover { background: #454340; color: #c8c5be; }
.tab.active { background: #81b64c; color: #fff; }

.mode-section { display: none; }
.mode-section.active { display: block; }

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #9b9892;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

input[type="text"], textarea {
  width: 100%;
  background: #222;
  border: 1px solid #444;
  border-radius: 6px;
  color: #e0ddd5;
  font-family: 'Consolas', 'SF Mono', monospace;
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.15s;
}

input[type="text"]:focus, textarea:focus {
  border-color: #81b64c;
}

textarea { resize: vertical; min-height: 60px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  width: 100%;
  margin-top: 10px;
}

.btn-primary { background: #81b64c; color: #fff; }
.btn-primary:hover { background: #6fa33e; }
.btn-secondary { background: #3a3733; color: #c8c5be; }
.btn-secondary:hover { background: #454340; }

.result-box {
  margin-top: 12px;
  padding: 10px 12px;
  background: #222;
  border-radius: 6px;
  border: 1px solid #444;
  font-family: 'Consolas', 'SF Mono', monospace;
  font-size: 13px;
  word-break: break-all;
  min-height: 36px;
  position: relative;
}

.result-box .copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  padding: 3px 8px;
  font-size: 11px;
  background: #3a3733;
  color: #9b9892;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.result-box .copy-btn:hover { background: #81b64c; color: #fff; }

.toggle-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
}

.toggle {
  position: relative;
  width: 40px;
  height: 22px;
  background: #3a3733;
  border-radius: 11px;
  cursor: pointer;
  border: none;
  transition: background 0.2s;
}

.toggle.on { background: #81b64c; }

.toggle::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.2s;
}

.toggle.on::after { transform: translateX(18px); }

.toggle-label {
  font-size: 13px;
  color: #c8c5be;
  cursor: pointer;
}

.free-readout {
  margin-top: 10px;
  padding: 10px 12px;
  background: #222;
  border-radius: 6px;
  border: 1px solid #444;
  font-family: 'Consolas', monospace;
  font-size: 14px;
  min-height: 40px;
  color: #81b64c;
  word-break: break-all;
}

.free-readout.empty { color: #666; font-style: italic; }

.info-text {
  font-size: 12px;
  color: #777;
  margin-top: 8px;
  line-height: 1.5;
}

/* ─── Board Area ─── */
.board-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.board-wrap {
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}

.board {
  display: grid;
  grid-template-columns: repeat(8, 70px);
  grid-template-rows: repeat(8, 70px);
  border: 3px solid #1a1816;
  border-radius: 3px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.sq {
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: default;
  font-size: 50px;
  line-height: 1;
  transition: background 0.1s;
}

.sq-light { background: #f0d9b5; }
.sq-dark { background: #b58863; }
.sq-hl-light { background: #cdd26a; }
.sq-hl-dark { background: #aaa23a; }
.sq.drag-over-light { background: #d4e157 !important; }
.sq.drag-over-dark { background: #a0b030 !important; }

.sq .piece {
  width: 56px;
  height: 56px;
  cursor: grab;
  z-index: 1;
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sq .piece svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
}

.sq .piece:active { cursor: grabbing; }

.sq .char-label {
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Consolas', monospace;
  pointer-events: none;
  z-index: 2;
}

.sq-light .char-label, .sq-hl-light .char-label { color: rgba(120,90,60,0.55); }
.sq-dark .char-label, .sq-hl-dark .char-label { color: rgba(230,210,180,0.55); }

.sq .coord-file {
  position: absolute;
  bottom: 2px;
  left: 3px;
  font-size: 11px;
  font-weight: 700;
  pointer-events: none;
}

.sq .coord-rank {
  position: absolute;
  top: 2px;
  right: 4px;
  font-size: 11px;
  font-weight: 700;
  pointer-events: none;
}

.sq-light .coord-file, .sq-light .coord-rank { color: #b58863; }
.sq-dark .coord-file, .sq-dark .coord-rank { color: #f0d9b5; }
.sq-hl-light .coord-file, .sq-hl-light .coord-rank { color: #9a9830; }
.sq-hl-dark .coord-file, .sq-hl-dark .coord-rank { color: #cdd26a; }

/* ─── Piece Tray ─── */
.tray-section {
  background: #302e2b;
  border-radius: 10px;
  padding: 12px 16px;
  width: 100%;
  max-width: 560px;
}

.tray-title {
  font-size: 12px;
  font-weight: 600;
  color: #9b9892;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}

.tray {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.tray-piece {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  cursor: grab;
  background: #3a3733;
  transition: background 0.15s, transform 0.1s;
  touch-action: none;
}

.tray-piece svg { width: 34px; height: 34px; }

.tray-piece:hover { background: #504d49; transform: scale(1.08); }
.tray-piece:active { cursor: grabbing; }

.tray-sep {
  width: 12px;
}

/* ─── Drag ghost ─── */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  opacity: 0.85;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
}

.drag-ghost svg { width: 56px; height: 56px; }

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .app {
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .sidebar { width: 100%; max-width: 560px; }
  .board { grid-template-columns: repeat(8, min(9vw, 70px)); grid-template-rows: repeat(8, min(9vw, 70px)); }
  .sq { width: unset; height: unset; aspect-ratio: 1; }
  .sq .piece { font-size: min(6vw, 50px); }
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">Chess<span>Cipher</span> <small style="font-size:12px;color:#777">v4.0</small></div>

    <div class="panel">
      <div class="tabs">
        <button class="tab active" data-mode="encrypt">Encrypt</button>
        <button class="tab" data-mode="decrypt">Decrypt</button>
        <button class="tab" data-mode="free">Free Board</button>
      </div>

      <!-- Encrypt -->
      <div class="mode-section active" id="sec-encrypt">
        <label for="enc-input">Message</label>
        <input type="text" id="enc-input" placeholder="Type your secret message..." maxlength="50" autocomplete="off">
        <button class="btn btn-primary" id="enc-btn">Encrypt</button>
        <div id="enc-result" style="display:none">
          <label style="margin-top:12px">Filename (copy this)</label>
          <div class="result-box">
            <span id="enc-filename"></span>
            <button class="copy-btn" id="enc-copy">Copy</button>
          </div>
        </div>
      </div>

      <!-- Decrypt -->
      <div class="mode-section" id="sec-decrypt">
        <label for="dec-input">Filename (without .png)</label>
        <input type="text" id="dec-input" placeholder="Paste filename here..." autocomplete="off">
        <button class="btn btn-primary" id="dec-btn">Decrypt</button>
        <div id="dec-result" style="display:none">
          <label style="margin-top:12px">Decoded Message</label>
          <div class="result-box" id="dec-message" style="color:#81b64c;font-size:16px;font-weight:700"></div>
        </div>
      </div>

      <!-- Free Board -->
      <div class="mode-section" id="sec-free">
        <p class="info-text" style="margin-top:0;margin-bottom:10px">Drag pieces from the tray onto the board. The decoded message from placed pieces appears below.</p>
        <label>Decoded from board</label>
        <div class="free-readout empty" id="free-readout">Place pieces on the board...</div>
        <button class="btn btn-secondary" id="free-clear" style="margin-top:8px">Clear Board</button>
      </div>
    </div>

    <div class="panel">
      <div class="toggle-row">
        <button class="toggle" id="overlay-toggle"></button>
        <span class="toggle-label" id="overlay-label">Show letter mapping</span>
      </div>
    </div>

    <div class="panel">
      <button class="btn btn-secondary" id="export-btn">Save Board as PNG</button>
    </div>
  </div>

  <!-- Board Area -->
  <div class="board-area">
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
    <div class="tray-section">
      <div class="tray-title">Piece Tray — drag onto the board</div>
      <div class="tray" id="tray"></div>
    </div>
  </div>
</div>

function getPieceSVG(color, type) {
  return PIECE_SVGS[color + '_' + type] || '';
}

const PIECE_NOTATION = { king:'K', queen:'Q', rook:'R', bishop:'B', knight:'N', pawn:'' };
const BACK_RANK = ['rook','knight','bishop','queen','king','bishop','knight','rook'];

const STATE = {
  mode: 'encrypt',
  overlayVisible: false,
  boardPieces: {},
  mapping: null,
  highlights: new Set(),
  currentMessage: ''
};

/* ─── Mapping ─── */
function createMapping() {
  const squares = [];
  for (const r of '12345678')
    for (const f of 'abcdefgh')
      squares.push(f + r);
  squares.sort((a, b) => sha256(CIPHER_SEED + a).localeCompare(sha256(CIPHER_SEED + b)));
  const charToSq = {}, sqToChar = {};
  for (let i = 0; i < CHARACTERS.length; i++) {
    charToSq[CHARACTERS[i]] = squares[i];
    sqToChar[squares[i]] = CHARACTERS[i];
  }
  return { charToSq, sqToChar };
}

/* ─── Seeded RNG (mulberry32) ─── */
function mulberry32(seed) {
  let s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashToSeed(text) {
  const h = sha256(text);
  return parseInt(h.substring(0, 8), 16);
}

/* ─── Board helpers ─── */
function isLightSquare(sq) {
  const col = sq.charCodeAt(0) - 97;
  const row = parseInt(sq[1]) - 1;
  return ((7 - row) + col) % 2 === 0;
}

function allSquares() {
  const sqs = [];
  for (const r of '12345678')
    for (const f of 'abcdefgh')
      sqs.push(f + r);
  return sqs;
}

function pickPieceType(sq, rng) {
  const rank = parseInt(sq[1]);
  const fi = sq.charCodeAt(0) - 97;
  if (rank === 1 || rank === 8) return BACK_RANK[fi];
  if (rank === 2 || rank === 7) return rng() < 0.75 ? 'pawn' : (rng() < 0.5 ? 'knight' : 'bishop');
  const r = rng();
  if (r < 0.50) return 'pawn';
  if (r < 0.65) return 'knight';
  if (r < 0.80) return 'bishop';
  if (r < 0.92) return 'rook';
  return 'queen';
}

function pickColor(sq, rng) {
  const rank = parseInt(sq[1]);
  if (rank <= 2) return rng() < 0.8 ? 'white' : 'black';
  if (rank >= 7) return rng() < 0.8 ? 'black' : 'white';
  return rng() < 0.5 ? 'white' : 'black';
}

/* ─── Legal origins for realistic highlights ─── */
function getLegalOrigins(sq, color, piece, boardState) {
  const col = sq.charCodeAt(0) - 97, row = parseInt(sq[1]) - 1;
  const pts = [];
  const toSqName = (c,r) => String.fromCharCode(97+c) + (r+1);
  if (piece === 'pawn') {
    const d = color === 'white' ? -1 : 1;
    if (row + d >= 0 && row + d < 8) { pts.push([col, row + d]); for (const dc of [-1,1]) { const nc = col+dc; if (nc >= 0 && nc < 8) pts.push([nc, row+d]); } }
    if (color === 'white' && row === 3 && !boardState[toSqName(col, row+1)]) pts.push([col, row + 2]);
    if (color === 'black' && row === 4 && !boardState[toSqName(col, row-1)]) pts.push([col, row - 2]);
  } else if (piece === 'knight') {
    for (const [dc,dr] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) { const nc=col+dc,nr=row+dr; if (nc>=0&&nc<8&&nr>=0&&nr<8) pts.push([nc,nr]); }
  } else if (piece === 'king') {
    for (let dc=-1;dc<=1;dc++) for (let dr=-1;dr<=1;dr++) { if (dc||dr) { const nc=col+dc,nr=row+dr; if (nc>=0&&nc<8&&nr>=0&&nr<8) pts.push([nc,nr]); } }
  } else {
    const dirs = [];
    if (piece==='bishop'||piece==='queen') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    if (piece==='rook'||piece==='queen') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
    for (const [dc,dr] of dirs) for (let d=1;d<8;d++) {
      const nc=col+dc*d,nr=row+dr*d;
      if (!(nc>=0&&nc<8&&nr>=0&&nr<8)) break;
      if (boardState[toSqName(nc,nr)]) break;
      pts.push([nc,nr]);
    }
  }
  return pts.map(([c,r]) => toSqName(c,r));
}

/* ─── Notation ─── */
function makeNotation(sq, pieceType, rng) {
  const pf = PIECE_NOTATION[pieceType];
  const cap = (pf && rng() < 0.2) ? 'x' : '';
  const chk = rng() < 0.06 ? '+' : '';
  return pf + cap + sq + chk;
}

function formatFilename(moves) {
  const parts = [];
  for (let i = 0; i < moves.length; i++) {
    parts.push(i % 2 === 0 ? (Math.floor(i/2)+1) + '.' + moves[i] : moves[i]);
  }
  let name = parts.join('_');
  if (name.length > 240) name = moves.join('_');
  return name + '.png';
}

function parseFilename(text) {
  text = text.replace(/\.png$/i, '').trim().replace(/^["']+|["']+$/g, '');
  const out = [];
  for (let tok of text.split('_')) {
    tok = tok.replace(/^\d+\./, '').replace(/[+#]+$/, '');
    if (tok.length >= 2) {
      const sq = tok.slice(-2).toLowerCase();
      if ('abcdefgh'.includes(sq[0]) && '12345678'.includes(sq[1])) out.push(sq);
    }
  }
  return out;
}

/* ─── Board generation (encrypt) ─── */
function generateEncryptBoard(msgSquares, msgText) {
  const rng = mulberry32(hashToSeed(msgText));
  const board = {};
  const uniqueMsg = new Set(msgSquares);

  for (let idx = 0; idx < msgSquares.length; idx++) {
    const sq = msgSquares[idx];
    if (!board[sq]) {
      const pc = idx % 2 === 0 ? 'white' : 'black';
      let pt = pickPieceType(sq, rng);
      if (pt === 'king') pt = ['queen','rook','bishop','knight'][Math.floor(rng()*4)];
      board[sq] = { color: pc, type: pt };
    }
  }

  const all = allSquares();
  let free = all.filter(s => !board[s]);

  for (const [color, prefs, fallbackRanks] of [
    ['white', ['g1','e1','f1','c1','h1'], '123'],
    ['black', ['g8','e8','f8','c8','h8'], '678']
  ]) {
    if (!Object.values(board).some(p => p.color === color && p.type === 'king')) {
      let placed = false;
      for (const c of prefs) {
        if (free.includes(c)) {
          board[c] = { color, type: 'king' };
          free = free.filter(x => x !== c);
          placed = true;
          break;
        }
      }
      if (!placed) {
        const fb = free.filter(s => fallbackRanks.includes(s[1]));
        if (fb.length) {
          const sq = fb[Math.floor(rng() * fb.length)];
          board[sq] = { color, type: 'king' };
          free = free.filter(x => x !== sq);
        }
      }
    }
  }

  const target = 22 + Math.floor(rng() * 9);
  const need = Math.max(0, target - Object.keys(board).length);
  for (let i = free.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [free[i], free[j]] = [free[j], free[i]];
  }

  let wc = Object.values(board).filter(p => p.color === 'white').length;
  let bc = Object.keys(board).length - wc;

  for (let i = 0; i < Math.min(need, free.length); i++) {
    const sq = free[i];
    let pc;
    if (wc < bc - 2) pc = 'white';
    else if (bc < wc - 2) pc = 'black';
    else pc = pickColor(sq, rng);

    let pt = pickPieceType(sq, rng);
    if (pt === 'king') pt = 'pawn';
    const rank = parseInt(sq[1]);
    if (pt === 'pawn' && (rank === 1 || rank === 8)) {
      pt = ['knight','bishop','rook'][Math.floor(rng()*3)];
    }
    board[sq] = { color: pc, type: pt };
    if (pc === 'white') wc++; else bc++;
  }

  const occupied = Object.keys(board);
  const emptyAfter = all.filter(s => !board[s]);
  const hl = new Set();
  for (let i = occupied.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [occupied[i], occupied[j]] = [occupied[j], occupied[i]];
  }
  for (const toSq of occupied) {
    const origins = getLegalOrigins(toSq, board[toSq].color, board[toSq].type, board);
    const valid = origins.filter(o => emptyAfter.includes(o));
    if (valid.length) {
      hl.add(toSq);
      hl.add(valid[Math.floor(rng() * valid.length)]);
      break;
    }
  }

  const moves = msgSquares.map(sq => makeNotation(sq, board[sq].type, rng));
  const fname = formatFilename(moves);

  return { board, highlights: hl, filename: fname };
}

/* ─── DOM ─── */
function placePiece(sq, color, type) {
  STATE.boardPieces[sq] = { color, type };
  renderSquare(sq);
  updateSidebar();
}

function removePiece(sq) {
  delete STATE.boardPieces[sq];
  renderSquare(sq);
  updateSidebar();
}

function clearBoard() {
  STATE.boardPieces = {};
  STATE.highlights = new Set();
  renderBoard();
  updateSidebar();
}

function renderSquare(sq) {
  const el = document.getElementById('sq-' + sq);
  if (!el) return;
  const light = isLightSquare(sq);
  const hl = STATE.highlights.has(sq);

  el.className = 'sq';
  if (hl) el.classList.add(light ? 'sq-hl-light' : 'sq-hl-dark');
  else el.classList.add(light ? 'sq-light' : 'sq-dark');

  let html = '';
  const p = STATE.boardPieces[sq];
  if (p) {
    const svg = getPieceSVG(p.color, p.type);
    html += `<span class="piece" data-sq="${sq}" data-color="${p.color}" data-type="${p.type}">${svg}</span>`;
  }

  if (STATE.overlayVisible && STATE.mapping) {
    const ch = STATE.mapping.sqToChar[sq];
    if (ch !== undefined) {
      const display = ch === ' ' ? '␣' : ch;
      html += `<span class="char-label">${display}</span>`;
    }
  }

  const col = sq.charCodeAt(0) - 97;
  const row = parseInt(sq[1]) - 1;
  if (row === 0) html += `<span class="coord-file">${sq[0]}</span>`;
  if (col === 0) html += `<span class="coord-rank">${sq[1]}</span>`;

  el.innerHTML = html;
}

function renderBoard() {
  const all = allSquares();
  for (const sq of all) renderSquare(sq);
}

function buildBoardDOM() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 7; r >= 0; r--) {
    for (let c = 0; c < 8; c++) {
      const sq = String.fromCharCode(97 + c) + (r + 1);
      const div = document.createElement('div');
      div.className = 'sq ' + (isLightSquare(sq) ? 'sq-light' : 'sq-dark');
      div.id = 'sq-' + sq;
      div.dataset.sq = sq;
      boardEl.appendChild(div);
    }
  }
  renderBoard();
}

function buildTray() {
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  for (const color of ['white', 'black']) {
    for (const type of ['king','queen','rook','bishop','knight','pawn']) {
      const div = document.createElement('div');
      div.className = 'tray-piece';
      div.innerHTML = getPieceSVG(color, type);
      div.dataset.color = color;
      div.dataset.type = type;
      div.setAttribute('touch-action', 'none');
      tray.appendChild(div);
    }
    if (color === 'white') {
      const sep = document.createElement('div');
      sep.className = 'tray-sep';
      tray.appendChild(sep);
    }
  }
}

function updateSidebar() {
  if (STATE.mode === 'free') {
    const readout = document.getElementById('free-readout');
    if (!STATE.mapping) return;
    const occupied = Object.keys(STATE.boardPieces);
    const chars = [];
    for (const sq of occupied) {
      const ch = STATE.mapping.sqToChar[sq];
      if (ch !== undefined) chars.push({ sq, ch });
    }
    if (chars.length === 0) {
      readout.textContent = 'Place pieces on the board...';
      readout.className = 'free-readout empty';
    } else {
      chars.sort((a, b) => a.sq.localeCompare(b.sq));
      readout.textContent = chars.map(c => c.ch === ' ' ? '␣' : c.ch).join('');
      readout.className = 'free-readout';
    }
  }
}

/* ─── Drag & Drop ─── */
let dragData = null;
let ghostEl = null;

function startDrag(e, color, type, fromSq) {
  e.preventDefault();
  dragData = { color, type, fromSq };

  ghostEl = document.createElement('div');
  ghostEl.className = 'drag-ghost';
  ghostEl.innerHTML = getPieceSVG(color, type);
  document.body.appendChild(ghostEl);
  moveGhost(e);
}

function moveGhost(e) {
  if (!ghostEl) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  const y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
  ghostEl.style.left = x + 'px';
  ghostEl.style.top = y + 'px';
}

function getSquareFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const sqEl = el.closest('.sq');
  return sqEl ? sqEl.dataset.sq : null;
}

function endDrag(e) {
  if (!dragData) return;
  const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX) || 0;
  const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY) || 0;
  const targetSq = getSquareFromPoint(x, y);

  if (dragData.fromSq) {
    removePiece(dragData.fromSq);
  }

  if (targetSq) {
    placePiece(targetSq, dragData.color, dragData.type);
  }

  document.querySelectorAll('.sq.drag-over-light, .sq.drag-over-dark').forEach(el => {
    el.classList.remove('drag-over-light', 'drag-over-dark');
  });

  if (ghostEl) { ghostEl.remove(); ghostEl = null; }
  dragData = null;
}

document.addEventListener('pointermove', (e) => {
  if (!dragData) return;
  moveGhost(e);

  document.querySelectorAll('.sq.drag-over-light, .sq.drag-over-dark').forEach(el => {
    el.classList.remove('drag-over-light', 'drag-over-dark');
  });
  const sq = getSquareFromPoint(e.clientX, e.clientY);
  if (sq) {
    const el = document.getElementById('sq-' + sq);
    if (el) el.classList.add(isLightSquare(sq) ? 'drag-over-light' : 'drag-over-dark');
  }
});

document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

document.getElementById('board').addEventListener('pointerdown', (e) => {
  const pieceEl = e.target.closest('.piece');
  if (!pieceEl) return;
  const sq = pieceEl.dataset.sq;
  const color = pieceEl.dataset.color;
  const type = pieceEl.dataset.type;
  if (sq && color && type) {
    pieceEl.style.visibility = 'hidden';
    startDrag(e, color, type, sq);
  }
});

document.getElementById('board').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const sqEl = e.target.closest('.sq');
  if (sqEl && STATE.boardPieces[sqEl.dataset.sq]) {
    removePiece(sqEl.dataset.sq);
  }
});

document.getElementById('tray').addEventListener('pointerdown', (e) => {
  const trayPiece = e.target.closest('.tray-piece');
  if (!trayPiece) return;
  startDrag(e, trayPiece.dataset.color, trayPiece.dataset.type, null);
});

/* ─── Tabs ─── */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.mode-section').forEach(s => s.classList.remove('active'));
    STATE.mode = tab.dataset.mode;
    document.getElementById('sec-' + STATE.mode).classList.add('active');
    if (STATE.mode === 'free') updateSidebar();
  });
});

/* ─── Overlay toggle ─── */
document.getElementById('overlay-toggle').addEventListener('click', function() {
  STATE.overlayVisible = !STATE.overlayVisible;
  this.classList.toggle('on', STATE.overlayVisible);
  renderBoard();
});

document.getElementById('overlay-label').addEventListener('click', function() {
  document.getElementById('overlay-toggle').click();
});

/* ─── Encrypt ─── */
document.getElementById('enc-btn').addEventListener('click', () => {
  const msg = document.getElementById('enc-input').value.toUpperCase();
  if (!msg) return;
  const { charToSq } = STATE.mapping;
  const bad = [...msg].filter(c => !charToSq[c]);
  if (bad.length) {
    alert('Unsupported characters: ' + [...new Set(bad)].join(', ') + '\nSupported: A-Z, space, 0-9');
    return;
  }
  const squares = [...msg].map(c => charToSq[c]);
  const result = generateEncryptBoard(squares, msg);

  STATE.boardPieces = result.board;
  STATE.highlights = result.highlights;
  STATE.currentMessage = msg;
  renderBoard();

  document.getElementById('enc-filename').textContent = result.filename;
  document.getElementById('enc-result').style.display = 'block';
});

document.getElementById('enc-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('enc-btn').click();
});

document.getElementById('enc-copy').addEventListener('click', () => {
  const text = document.getElementById('enc-filename').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('enc-copy');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
});

/* ─── Decrypt ─── */
document.getElementById('dec-btn').addEventListener('click', () => {
  const code = document.getElementById('dec-input').value;
  if (!code) return;
  const { sqToChar } = STATE.mapping;
  const sqs = parseFilename(code);
  if (!sqs.length) {
    document.getElementById('dec-message').textContent = 'No valid moves found.';
    document.getElementById('dec-result').style.display = 'block';
    return;
  }
  const msg = sqs.map(s => sqToChar[s] || '?').join('');
  document.getElementById('dec-message').textContent = msg;
  document.getElementById('dec-result').style.display = 'block';
});

document.getElementById('dec-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('dec-btn').click();
});

/* ─── Free Board ─── */
document.getElementById('free-clear').addEventListener('click', clearBoard);

/* ─── Export as PNG ─── */
function exportBoardAsPNG(filename) {
  const S=100,M=30,BP=S*8,CS=BP+2*M;
  const canvas=document.createElement('canvas');
  canvas.width=CS;canvas.height=CS;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#312e2b';ctx.fillRect(0,0,CS,CS);
  const HL_L='#cdd26a',HL_D='#aaa23a';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const sq=String.fromCharCode(97+c)+String(8-r);
    const x=M+c*S,y=M+r*S,light=(r+c)%2===0;
    ctx.fillStyle=STATE.highlights.has(sq)?(light?HL_L:HL_D):(light?'#f0d9b5':'#b58863');
    ctx.fillRect(x,y,S,S);
  }
  ctx.font='bold 13px Arial,sans-serif';
  for(let i=0;i<8;i++){
    const sq='abcdefgh'[i]+'1',light=isLightSquare(sq);
    ctx.fillStyle=light?'#ba8960':'#ecdab9';
    ctx.textAlign='right';ctx.textBaseline='alphabetic';
    ctx.fillText('abcdefgh'[i],M+i*S+S-4,M+7*S+S-4);
  }
  for(let j=0;j<8;j++){
    const sq='a'+String(j+1),light=isLightSquare(sq);
    ctx.fillStyle=light?'#ba8960':'#ecdab9';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(String(j+1),M+4,M+(7-j)*S+3);
  }
  const PC={white_king:'♔',white_queen:'♕',white_rook:'♖',white_bishop:'♗',white_knight:'♘',white_pawn:'♙',black_king:'♚',black_queen:'♛',black_rook:'♜',black_bishop:'♝',black_knight:'♞',black_pawn:'♟'};
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='68px "Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif';
  for(const[sq,p]of Object.entries(STATE.boardPieces)){
    const col=sq.charCodeAt(0)-97,row=parseInt(sq[1])-1;
    const cx=M+col*S+S/2,cy=M+(7-row)*S+S/2+2;
    const ch=PC[p.color+'_'+p.type];if(!ch)continue;
    if(p.color==='white'){ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeText(ch,cx,cy);ctx.fillStyle='#fff';ctx.fillText(ch,cx,cy);}
    else{ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.lineJoin='round';ctx.strokeText(ch,cx,cy);ctx.fillStyle='#333';ctx.fillText(ch,cx,cy);}
  }
  canvas.toBlob(function(blob){
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename||'chess_board.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),100);
  },'image/png');
}

document.getElementById('export-btn').addEventListener('click', () => {
  const fname = STATE.currentMessage ? formatFilename(
    Object.keys(STATE.boardPieces).slice(0,STATE.currentMessage.length).map(sq => {
      const p = STATE.boardPieces[sq];
      return (PIECE_NOTATION[p?.type]||'') + sq;
    })
  ) : 'chess_board.png';
  exportBoardAsPNG(fname);
});

window.APP = {

  mapping: STATE.mapping, createMapping, parseFilename, generateEncryptBoard
};
